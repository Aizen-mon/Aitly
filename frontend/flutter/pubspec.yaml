name: ai_tally_app
description: AI Assistant for Tally Users - Flutter starter
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  google_fonts: ^6.2.0
  image_picker: ^1.0.0
  camera: ^0.10.0
  google_mlkit_text_recognition: ^0.5.0
  cross_file: ^0.3.0
  # Audio recording for local voice processing
  record: ^5.1.0
  path_provider: ^2.1.0
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
